name: PR Review

on:
  pull_request:
    branches:
      - main

jobs:
  review:
    name: Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        id: lint
        continue-on-error: true
        run: |
          pnpm lint 2>&1 | tee lint_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Run build
        id: build
        continue-on-error: true
        run: |
          pnpm build 2>&1 | tee build_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Run tests
        id: test
        continue-on-error: true
        run: |
          pnpm test 2>&1 | tee test_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Check function line lengths
        id: linelength
        continue-on-error: true
        run: |
          errors=0
          find apps packages -name "*.ts" -o -name "*.tsx" | while read file; do
            if [ -f "$file" ]; then
              node -e "
                const fs = require('fs');
                const lines = fs.readFileSync('$file', 'utf-8').split('\n');
                let inside = false, startLine = 0, name = '';
                for (let i = 0; i < lines.length; i++) {
                  const m = lines[i].match(/^\s*(export\s+)?(async\s+)?function\s+(\w+)/);
                  if (m) {
                    if (inside) {
                      const count = i - startLine;
                      if (count > 130) console.log(\`OVER 130: \${name} in \$file (\${count} lines, line \${startLine+1})\`);
                    }
                    inside = true; startLine = i; name = m[3];
                  }
                }
              "
            fi
          done 2>&1 | tee linelength_output.txt || true
          if grep -q "OVER 130" linelength_output.txt; then
            echo "exit_code=1" >> $GITHUB_OUTPUT
          else
            echo "exit_code=0" >> $GITHUB_OUTPUT
          fi

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const buildPassed = '${{ steps.build.outputs.exit_code }}' === '0';
            const lintPassed = '${{ steps.lint.outputs.exit_code }}' === '0';
            const testPassed = '${{ steps.test.outputs.exit_code }}' === '0';
            const linelengthPassed = '${{ steps.linelength.outputs.exit_code }}' === '0';

            const failedChecks = [];
            if (!buildPassed) failedChecks.push('- [ ] `pnpm build` ❌');
            if (!lintPassed) failedChecks.push('- [ ] `pnpm lint` ❌');
            if (!testPassed) failedChecks.push('- [ ] `pnpm test` ❌');
            if (!linelengthPassed) failedChecks.push('- [ ] 函数长度不超过 130 行 ❌');

            const status = failedChecks.length === 0 ? '✅ 全部通过' : '❌ 部分检查未通过';

            const body = `## PR 审查报告

### 检查结果

| 检查项 | 状态 |
|--------|------|
| \`pnpm build\` | ${buildPassed ? '✅' : '❌'} |
| \`pnpm lint\` | ${lintPassed ? '✅' : '❌'} |
| \`pnpm test\` | ${testPassed ? '✅' : '❌'} |
| 函数 ≤ 130 行 | ${linelengthPassed ? '✅' : '❌'} |

### 未通过的检查

${failedChecks.length > 0 ? failedChecks.join('\n') : '全部通过，无需修改。'}

### 规范文档

请参考 [docs/Standard.md](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/Standard.md) 查看完整规范。

---

*自动生成 by PR Review workflow*
`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

            if (failedChecks.length > 0) {
              core.setFailed('部分检查未通过');
            }
